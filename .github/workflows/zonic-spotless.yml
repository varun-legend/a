name: ✨ Spotless Formatting Pipeline (Zonic)

on:
  # Runs automatically once a week (Every Sunday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 0'

  # Keeps manual trigger option available
  workflow_dispatch:

  # Keeps repository dispatch option available
  repository_dispatch:
    types: [spotless]

concurrency:
  group: zonic-spotless-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPO: "varun-legend/Zonic"

jobs:
  apply-spotless:
    name: Format Code • Spotless
    runs-on: ubuntu-latest

    env:
      PAT: ${{ secrets.PAT }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    steps:
      - name: 📁 Checkout source repo (Zonic)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: ⚡ Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

      - name: ✨ Apply Spotless formatting
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew spotlessApply --no-configuration-cache --build-cache

      - name: 💾 Commit Spotless changes back to source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':(exclude)**/build/**' \
            ':(exclude)**/.gradle/**' \
            ':(exclude)**/.kotlin/**'

          if git diff --cached --quiet; then
            echo "No formatting changes detected."
            exit 0
          fi

          git commit -m "style: apply spotless formatting [skip zonic]"

          SOURCE_BRANCH="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || true)"
          SOURCE_BRANCH="${SOURCE_BRANCH:-main}"

          git push \
            "https://x-access-token:${{ secrets.PAT }}@github.com/${{ env.SOURCE_REPO }}.git" \
            HEAD:"$SOURCE_BRANCH"
