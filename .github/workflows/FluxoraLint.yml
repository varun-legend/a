name: 🔎 Android API Compatibility (Fluxora)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxora-api-lint-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: "varun-legend/Fluxora"

jobs:
  build-and-publish:
    name: Lint • Android API Compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 75

    steps:
      - name: 📁 Checkout Fluxora
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PAT }}
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: 🔧 Setup Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.11 for Fluxora
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

      - name: 🛡️ Run Android API compatibility lint
        id: lint
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p app/build/reports
          ./gradlew --continue lintArm64Release lintArmv7Release --configuration-cache --build-cache 2>&1 | tee app/build/reports/lint-console.log

      - name: 📦 Upload complete Fluxora lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluxora-api-lint-reports-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-console.log
            app/build/intermediates/lint_intermediate_text_report/**/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: ❌ Preserve lint failure status
        if: always() && steps.lint.outcome == 'failure'
        run: |
          echo "Android API compatibility lint failed. Download the artifact for the complete findings."
          exit 1
