name: 🔎 Android API Compatibility (Zonic)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ZonicLint.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zonic-api-lint-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: "varun-legend/Zonic"

jobs:
  build-and-publish:
    name: Validate • Android API Compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: 📁 Checkout Zonic
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PAT }}
          ref: main
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: 🔧 Setup Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: ⚡ Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

      - name: 🧪 Run JVM unit tests
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p app/build/reports
          ./gradlew testDebugUnitTest --configuration-cache --build-cache 2>&1 | tee app/build/reports/unit-test-console.log

      - name: 🛡️ Run Android API compatibility lint
        id: lint
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p app/build/reports
          ./gradlew --continue lintRelease --configuration-cache --build-cache 2>&1 | tee app/build/reports/lint-console.log

      - name: 📦 Upload complete Zonic validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zonic-api-lint-reports-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            app/build/reports/lint-console.log
            app/build/reports/unit-test-console.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/intermediates/lint_intermediate_text_report/**/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: ❌ Preserve validation failure status
        if: always() && (steps.tests.outcome == 'failure' || steps.lint.outcome == 'failure')
        run: |
          echo "Unit test outcome: ${{ steps.tests.outcome }}"
          echo "Android API compatibility lint outcome: ${{ steps.lint.outcome }}"
          exit 1
