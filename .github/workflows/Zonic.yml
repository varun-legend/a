name: 🚀 Cross-Repo Android Release Pipeline (Zonic)

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/Zonic.yml'

  repository_dispatch:
    types: [zonic]

  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      build_type:
        description: "Build variant"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

concurrency:
  group: zonic-release-${{ github.repository }}-${{ github.ref_name }}-${{ github.event.client_payload.build_type || github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPO: "varun-legend/Zonic"

jobs:
  build-and-publish:
    name: Build • Release
    runs-on: ubuntu-26.04-arm

    env:
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      PAT: ${{ secrets.PAT }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      BUILD_TYPE: ${{ github.event.client_payload.build_type || github.event.inputs.build_type || 'release' }}
      BUMP: ${{ github.event.client_payload.bump || github.event.inputs.bump || 'patch' }}

    steps:
      - name: 📁 Checkout source repo (Zonic)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🏗️ Register x86_64 QEMU Emulation
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: amd64
          cache-image: true

      - name: ⚡ Restore apt package cache (amd64 libs)
        id: apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-amd64-libs-${{ runner.os }}-${{ runner.arch }}-v2

      - name: 📦 Install x86_64 Libraries
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture amd64
          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            libc6:amd64 \
            libstdc++6:amd64 \
            zlib1g:amd64

      - name: 💾 Save apt package cache (amd64 libs)
        if: ${{ success() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-amd64-libs-${{ runner.os }}-${{ runner.arch }}-v2

      - name: 🔧 Setup Temurin JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: ⚡ Cache Android SDK
        uses: actions/cache@v6.1.0
        with:
          path: |
            /home/runner/.android/sdk/platforms
            /home/runner/.android/sdk/build-tools
            /home/runner/.android/sdk/platform-tools
          key: android-sdk-37-${{ runner.os }}-${{ runner.arch }}

      - name: 📱 Setup Android SDK tools
        uses: android-actions/setup-android@v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: 🔎 Resolve and install Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          echo "SDKMANAGER=$SDKMANAGER"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo
          echo "Available Android SDK platforms:"
          sdkmanager --list | sed -n '/Available Packages:/,/Available Updates:/p' | grep -E 'platforms;|system-images;' || true

          echo
          echo "Searching for API 37 platform package..."

          PLATFORM_PACKAGE="$(
            sdkmanager --list \
              | awk '
                  /Available Packages:/ { in_available = 1; next }
                  /Available Updates:/ { in_available = 0 }
                  in_available && $1 ~ /^platforms;/ && $1 ~ /37/ {
                    print $1
                  }
                ' \
              | head -n 1
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Could not find an Android SDK platform package for API 37."
            echo
            echo "Matching SDK entries:"
            sdkmanager --list | grep -iE 'cinnamon|platform.*37|37.*platform' || true
            exit 1
          fi

          echo "Resolved platform package: $PLATFORM_PACKAGE"

          echo
          echo "Searching for latest Android 37 Build Tools..."

          BUILD_TOOLS_PACKAGE="$(
            sdkmanager --list \
              | awk '
                  /Available Packages:/ { in_available = 1; next }
                  /Available Updates:/ { in_available = 0 }
                  in_available && $1 ~ /^build-tools;37\./ {
                    print $1
                  }
                ' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "ERROR: Could not find Android 37 Build Tools."
            echo
            echo "Matching Build Tools entries:"
            sdkmanager --list | grep -iE 'build-tools;37\.' || true
            exit 1
          fi

          echo "Resolved Build Tools package: $BUILD_TOOLS_PACKAGE"

          echo
          echo "Installing:"
          echo "  $PLATFORM_PACKAGE"
          echo "  $BUILD_TOOLS_PACKAGE"

          sdkmanager "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

          echo
          echo "Installed SDK packages:"
          sdkmanager --list_installed | grep -E 'platforms;|build-tools;' || true

      - name: ✅ Verify Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"

          echo "SDK root: $SDK_ROOT"

          echo
          echo "Platforms:"
          find "$SDK_ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -print 2>/dev/null || true

          echo
          echo "Build Tools:"
          find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d -print 2>/dev/null || true

          echo
          echo "Checking API 37 platform..."

          API37_PLATFORM="$(
            find "$SDK_ROOT/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name '*37*' \
              | head -n 1
          )"

          if [ -z "$API37_PLATFORM" ]; then
            echo "ERROR: Android API 37 platform was not installed."
            exit 1
          fi

          echo "API 37 platform: $API37_PLATFORM"

          echo
          echo "Checking Android 37 Build Tools..."

          API37_BUILD_TOOLS="$(
            find "$SDK_ROOT/build-tools" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -name '37.*' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$API37_BUILD_TOOLS" ]; then
            echo "ERROR: Android 37 Build Tools were not installed."
            exit 1
          fi

          echo "Build Tools: $API37_BUILD_TOOLS"

          echo
          echo "Android SDK 37 verification passed."

      - name: ⚡ Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

      - name: 🔐 Decode release keystore
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.RELEASE_STORE_FILE }}" ]; then
            echo "ERROR: RELEASE_STORE_FILE secret not set"
            exit 1
          fi

          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.p12"

          printf '%s' "${{ secrets.RELEASE_STORE_FILE }}" \
            | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 🔍 Determine version from Git tags
        id: version
        run: |
          set -euo pipefail

          git fetch --tags origin || true

          LATEST_TAG=$(
            (git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v 'debug' || true) \
              | sort -V \
              | tail -n 1 || true
          )

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          TAG_CLEAN="${LATEST_TAG#v}"

          IFS='.' read -r MA MI PA <<< "$TAG_CLEAN"

          MA=$(printf '%s' "${MA:-0}" | (grep -oE '^[0-9]+' || echo 0))
          MI=$(printf '%s' "${MI:-0}" | (grep -oE '^[0-9]+' || echo 0))
          PA=$(printf '%s' "${PA:-0}" | (grep -oE '^[0-9]+' || echo 0))

          if [ "$BUILD_TYPE" != "release" ]; then
            NEW_VERSION="${MA}.${MI}.${PA}"
          else
            case "$BUMP" in
              major)
                MA=$((MA + 1))
                MI=0
                PA=0
                ;;
              minor)
                MI=$((MI + 1))
                PA=0
                ;;
              *)
                PA=$((PA + 1))
                ;;
            esac

            NEW_VERSION="${MA}.${MI}.${PA}"
          fi

          NEW_CODE=$((MA * 1000000 + MI * 1000 + PA))

          if [ "$NEW_CODE" -eq 0 ]; then
            NEW_CODE=1
          fi

          echo "Resolved version: $NEW_VERSION"
          echo "Resolved version code: $NEW_CODE"

          echo "version_name=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: 🧱 Build
        id: build
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          VER_NAME="${{ steps.version.outputs.version_name }}"
          VER_CODE="${{ steps.version.outputs.version_code }}"

          echo "Building Zonic $VER_NAME"
          echo "Version code: $VER_CODE"
          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug \
              -PversionName="$VER_NAME" \
              -PversionCode="$VER_CODE" \
              --configuration-cache \
              --build-cache
          else
            RELEASE_STORE_FILE="${KEYSTORE_PATH:-}" \
            RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            ./gradlew assembleRelease \
              -PversionName="$VER_NAME" \
              -PversionCode="$VER_CODE" \
              --configuration-cache \
              --build-cache \
              --parallel
          fi

          echo "built=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: 🔎 Find APK
        id: find-apk
        run: |
          set -euo pipefail

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*debug*.apk" \
                | head -n 1 || true
            )
          else
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*release*.apk" \
                | head -n 1 || true
            )
          fi

          if [ -z "$APK" ]; then
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*.apk" \
                | head -n 1 || true
            )
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            TARGET_NAME="Zonic-v${{ steps.version.outputs.version_name }}-debug.apk"
          else
            TARGET_NAME="Zonic-v${{ steps.version.outputs.version_name }}.apk"
          fi

          TARGET_PATH="$(dirname "$APK")/$TARGET_NAME"

          mv "$APK" "$TARGET_PATH"

          echo "APK found: $APK"
          echo "APK renamed to: $TARGET_PATH"

          echo "apk_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: 🧾 Create or update GitHub Release & Tag
        if: ${{ steps.find-apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TYPE" = "debug" ]; then
            TAG="v${{ steps.version.outputs.version_name }}-debug"
            TITLE="🧪 Debug Release ${TAG}"
            BODY="Debug release ${TAG} (code ${{ steps.version.outputs.version_code }})"
          else
            TAG="v${{ steps.version.outputs.version_name }}"
            TITLE="📦 Release ${TAG}"
            BODY="Release ${TAG} (code ${{ steps.version.outputs.version_code }})"
          fi

          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"

          echo "Release tag: $TAG"
          echo "APK: $APK_PATH"

          if gh release view "$TAG" --repo "${{ env.SOURCE_REPO }}" >/dev/null 2>&1; then
            echo "Release already exists. Updating APK..."

            gh release upload \
              "$TAG" \
              "$APK_PATH" \
              --repo "${{ env.SOURCE_REPO }}" \
              --clobber
          else
            echo "Creating new release..."

            gh release create \
              "$TAG" \
              "$APK_PATH" \
              --repo "${{ env.SOURCE_REPO }}" \
              -t "$TITLE" \
              -n "$BODY"
          fi
