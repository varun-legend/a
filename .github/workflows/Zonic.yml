name: 🚀 Cross-Repo Android Release Pipeline (Zonic)

on:
  repository_dispatch:
    types: [zonic]

  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      build_type:
        description: "Build variant"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

concurrency:
  group: zonic-release-${{ github.repository }}-${{ github.ref_name }}-${{ github.event.client_payload.build_type || github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_REPO: "varun-legend/Zonic"

jobs:
  build-and-publish:
    name: Build • Release
    runs-on: ubuntu-24.04-arm

    env:
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      PAT: ${{ secrets.PAT }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      BUILD_TYPE: ${{ github.event.client_payload.build_type || github.event.inputs.build_type || 'release' }}
      BUMP: ${{ github.event.client_payload.bump || github.event.inputs.bump || 'patch' }}

    steps:
      - name: 📁 Checkout source repo (Zonic)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: 📦 Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_SDK_ROOT"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          echo "Accepting any newly requested licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installed SDK packages:"
          sdkmanager --list_installed

      - name: ⚡ Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

      - name: 🔐 Decode release keystore
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.RELEASE_STORE_FILE }}" ]; then
            echo "ERROR: RELEASE_STORE_FILE secret not set"
            exit 1
          fi

          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.p12"

          printf '%s' "${{ secrets.RELEASE_STORE_FILE }}" \
            | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 🔍 Determine version from Git tags
        id: version
        run: |
          set -euo pipefail

          git fetch --tags origin || true

          LATEST_TAG=$(
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -v 'debug' \
              | sort -V \
              | tail -n 1 || true
          )

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          TAG_CLEAN="${LATEST_TAG#v}"

          IFS='.' read -r MA MI PA <<< "$TAG_CLEAN"

          MA=$(printf '%s' "${MA:-0}" | grep -oE '^[0-9]+' || echo 0)
          MI=$(printf '%s' "${MI:-0}" | grep -oE '^[0-9]+' || echo 0)
          PA=$(printf '%s' "${PA:-0}" | grep -oE '^[0-9]+' || echo 0)

          if [ "$BUILD_TYPE" != "release" ]; then
            NEW_VERSION="${MA}.${MI}.${PA}"
          else
            case "$BUMP" in
              major)
                MA=$((MA + 1))
                MI=0
                PA=0
                ;;
              minor)
                MI=$((MI + 1))
                PA=0
                ;;
              *)
                PA=$((PA + 1))
                ;;
            esac

            NEW_VERSION="${MA}.${MI}.${PA}"
          fi

          # Version code:
          # MA * 1,000,000 + MI * 1,000 + PA
          # Example: 1.2.3 -> 1002003
          NEW_CODE=$((MA * 1000000 + MI * 1000 + PA))

          if [ "$NEW_CODE" -eq 0 ]; then
            NEW_CODE=1
          fi

          echo "Resolved version: $NEW_VERSION"
          echo "Resolved version code: $NEW_CODE"

          echo "version_name=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: 🧱 Build
        id: build
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          VER_NAME="${{ steps.version.outputs.version_name }}"
          VER_CODE="${{ steps.version.outputs.version_code }}"

          echo "Building Zonic $VER_NAME"
          echo "Version code: $VER_CODE"
          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug \
              -PversionName="$VER_NAME" \
              -PversionCode="$VER_CODE" \
              --configuration-cache \
              --build-cache
          else
            RELEASE_STORE_FILE="$KEYSTORE_PATH" \
            RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            ./gradlew assembleRelease \
              -PversionName="$VER_NAME" \
              -PversionCode="$VER_CODE" \
              --configuration-cache \
              --build-cache \
              --parallel
          fi

          echo "built=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: 🔎 Find APK
        id: find-apk
        run: |
          set -euo pipefail

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*debug*.apk" \
                | head -n 1 || true
            )
          else
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*release*.apk" \
                | head -n 1 || true
            )
          fi

          if [ -z "$APK" ]; then
            APK=$(
              find app/build/outputs \
                -type f \
                -name "*.apk" \
                | head -n 1 || true
            )
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            TARGET_NAME="Zonic-v${{ steps.version.outputs.version_name }}-debug.apk"
          else
            TARGET_NAME="Zonic-v${{ steps.version.outputs.version_name }}.apk"
          fi

          TARGET_PATH="$(dirname "$APK")/$TARGET_NAME"

          mv "$APK" "$TARGET_PATH"

          echo "APK found: $APK"
          echo "APK renamed to: $TARGET_PATH"

          echo "apk_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: 🧾 Create or update GitHub Release & Tag
        if: ${{ steps.find-apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TYPE" = "debug" ]; then
            TAG="v${{ steps.version.outputs.version_name }}-debug"
            TITLE="🧪 Debug Release ${TAG}"
            BODY="Debug release ${TAG} (code ${{ steps.version.outputs.version_code }})"
          else
            TAG="v${{ steps.version.outputs.version_name }}"
            TITLE="📦 Release ${TAG}"
            BODY="Release ${TAG} (code ${{ steps.version.outputs.version_code }})"
          fi

          APK_PATH="${{ steps.find-apk.outputs.apk_path }}"

          echo "Release tag: $TAG"
          echo "APK: $APK_PATH"

          if gh release view "$TAG" \
              --repo "${{ env.SOURCE_REPO }}" >/dev/null 2>&1; then

            echo "Release already exists. Updating APK..."

            gh release upload "$TAG" "$APK_PATH" \
              --repo "${{ env.SOURCE_REPO }}" \
              --clobber

          else

            echo "Creating new release..."

            gh release create "$TAG" "$APK_PATH" \
              --repo "${{ env.SOURCE_REPO }}" \
              -t "$TITLE" \
              -n "$BODY"

          fi
