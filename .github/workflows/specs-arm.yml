name: 🔍 Runner Specs Check (ARM64)

on:
  workflow_dispatch:

jobs:
  specs:
    name: Ubuntu ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 🧠 CPU Info
        run: |
          echo "=== CPU ==="
          nproc --all
          echo
          lscpu

      - name: 💾 Memory Info
        run: |
          echo "=== Memory ==="
          free -h

      - name: 💽 Disk Info
        run: |
          echo "=== Disk ==="
          df -h

      - name: 🏷️ OS / Arch Info
        run: |
          echo "=== OS ==="
          uname -a
          echo
          cat /etc/os-release
